name: Relevé quotidien

# Chaque soir vers minuit (heure de Paris), écrit le relevé du jour dans la table
# Airtable « Suivi quotidien » : nombre d'offres, de marques, de créateurs et clics.
on:
  schedule:
    - cron: '50 21 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Écrire le relevé du jour
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/daily-stats.js

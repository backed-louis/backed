name: Vérifier les logos des marques

# Liste chaque marque qui a une offre active avec code, avec la taille du logo trouvé et sa source, et une planche
# (onglet Actions → Artifacts). Les marques sans logo net sont écartées des vidéos tant qu'on n'en ajoute pas un
# dans scripts/reels/logos/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet Pillow==11.3.0 numpy==2.1.3 scipy==1.14.1 requests==2.32.3 google-auth==2.38.0 cairosvg==2.7.1
      - name: Vérifier les logos
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python3 scripts/reels/logo_audit.py --out out/logos
          cat out/logos/logos.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: logos-${{ github.run_number }}
          path: out/logos
          retention-days: 14
      - name: Garder la planche dans le dépôt (branche logos-apercu)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r out/logos /tmp/logos
          git checkout --orphan logos-apercu
          git rm -rf --quiet .
          cp /tmp/logos/* .
          printf '%s\n' '{ "git": { "deploymentEnabled": false }, "ignoreCommand": "exit 0" }' > vercel.json
          git add -- *.jpg *.md vercel.json
          git commit -q -m "Logos des marques (run ${{ github.run_number }})"
          git push -q -f origin logos-apercu

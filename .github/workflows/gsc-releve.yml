name: Search Console (relevé chiffré)
on:
  push:
    branches: [gsc-releve]
permissions:
  contents: read
jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth==2.38.0 requests==2.32.3
      - env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          cd scripts/reels
          python3 - <<'PY'
          import json, datetime as dt, gsc
          s = gsc.session(); site = gsc.pick_site(s)
          ranked, allb, period = gsc.brand_stats(s, site)
          end = dt.date.today() - dt.timedelta(days=1)
          rows = gsc.query(s, site, end - dt.timedelta(days=27), end, ["page"], [{"dimension": "page", "operator": "contains", "expression": "/marque/"}])
          top28 = sorted(({"page": r["keys"][0], "imp": r["impressions"], "clics": r["clicks"], "pos": round(r["position"], 1)} for r in rows), key=lambda r: -r["imp"])[:40]
          json.dump({"periode": period, "hausse": ranked, "top28": top28}, open("/tmp/gsc.json", "w"), ensure_ascii=False)
          print("ok", len(ranked), len(top28))
          PY

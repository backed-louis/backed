name: Vidéos de la semaine

# Chaque vendredi vers 18h (heure de Paris en hiver), génère le top 3 du lendemain samedi (les marques les plus en
# hausse dans la Search Console) et les vidéos « Code du jour » du dimanche au vendredi suivants, à partir d'Airtable,
# avec pour chaque jour la carte WhatsApp (12h15). Pas de carrousel de la semaine.
# Le vendredi soir plutôt que le samedi matin : GitHub retarde parfois les tâches planifiées de plusieurs
# heures, et le lot doit être prêt au réveil le samedi.
# Les fichiers sont à télécharger dans l'onglet Actions, en bas du run (« Artifacts »).
# Un aperçu léger (planches JPEG + publications.md) est gardé sur la branche semaine-apercu.
on:
  schedule:
    - cron: '23 17 * * 5'
  workflow_dispatch:
    inputs:
      start:
        description: 'Premier jour de la semaine (AAAA-MM-JJ). Vide = prochain dimanche.'
        required: false
        default: ''
      marques:
        description: 'Lot spécial : marques imposées, séparées par des virgules, un jour chacune à partir du premier jour (pas de top 3). Vide = lot normal.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet Pillow==11.3.0 numpy==2.1.3 scipy==1.14.1 playwright==1.49.1 google-auth==2.38.0 requests==2.32.3
          # vidéos premium : pages HTML rendues image par image dans Chromium (scripts/motion)
          python -m playwright install --with-deps chromium
      - name: Generate videos
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # compte de service Google, en lecture seule sur la Search Console (classement des marques en hausse)
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          START: ${{ github.event.inputs.start }}
          MARQUES: ${{ github.event.inputs.marques }}
        run: |
          ARGS="--out out/semaine --preview out/apercu"
          [ -n "$START" ] && ARGS="$ARGS --start $START"
          if [ -n "$MARQUES" ]; then
            python3 scripts/reels/generate_week.py $ARGS --marques "$MARQUES"
          else
            python3 scripts/reels/generate_week.py $ARGS
          fi
          cat out/semaine/publications.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: backed-semaine-${{ github.run_number }}
          path: out/semaine
          retention-days: 30
      - name: Garder l'aperçu dans le dépôt (branche semaine-apercu)
        if: ${{ github.event.inputs.marques == '' || github.event.inputs.marques == null }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r out/apercu /tmp/apercu
          # Branche sans historique, remplacée à chaque run : seul le dernier aperçu compte.
          git checkout --orphan semaine-apercu
          git rm -rfq --cached .
          git clean -fdq -e out
          cp /tmp/apercu/* .
          git add -- *.jpg *.md *.txt
          git commit -qm "Aperçu du $(date -u +%F) (run ${{ github.run_number }})"
          git push -f origin semaine-apercu
      - name: Garder tous les fichiers de la semaine (branche semaine-fichiers, ou lot-special)
        env:
          MARQUES: ${{ github.event.inputs.marques }}
        run: |
          # Les vidéos et visuels complets, pour que Claude puisse les renvoyer sans le zip.
          BRANCHE=semaine-fichiers
          [ -n "$MARQUES" ] && BRANCHE=lot-special
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r out/semaine /tmp/semaine
          git checkout --orphan $BRANCHE
          git rm -rfq --cached .
          git clean -fdq -e out
          cp -r /tmp/semaine/* .
          git add -- *.mp4 *.png *.md
          git commit -qm "Fichiers du $(date -u +%F) (run ${{ github.run_number }})"
          git push -f origin $BRANCHE

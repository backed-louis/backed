name: Vidéos de la semaine

# Chaque samedi à 8h (heure de Paris en hiver), génère le top 3 du jour (clics des 7 derniers
# jours) et les vidéos « Code du jour » du dimanche au vendredi suivants, à partir d'Airtable,
# avec pour chaque jour l'image de story et la carte WhatsApp, et le carrousel de la semaine.
# Les fichiers sont à télécharger dans l'onglet Actions, en bas du run (« Artifacts »).
# Un aperçu léger (planches JPEG + publications.md) est gardé sur la branche semaine-apercu.
on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:
    inputs:
      start:
        description: 'Premier jour de la semaine (AAAA-MM-JJ). Vide = prochain dimanche.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet Pillow==11.3.0 numpy==2.1.3 scipy==1.14.1
      - name: Generate videos
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ]; then
            python3 scripts/reels/generate_week.py --out out/semaine --preview out/apercu --start "$START"
          else
            python3 scripts/reels/generate_week.py --out out/semaine --preview out/apercu
          fi
          cat out/semaine/publications.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: backed-semaine-${{ github.run_number }}
          path: out/semaine
          retention-days: 30
      - name: Garder l'aperçu dans le dépôt (branche semaine-apercu)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r out/apercu /tmp/apercu
          # Branche sans historique, remplacée à chaque run : seul le dernier aperçu compte.
          git checkout --orphan semaine-apercu
          git rm -rfq --cached .
          git clean -fdq -e out
          cp /tmp/apercu/* .
          git add -- *.jpg *.md *.txt
          git commit -qm "Aperçu du $(date -u +%F) (run ${{ github.run_number }})"
          git push -f origin semaine-apercu
      - name: Garder tous les fichiers de la semaine (branche semaine-fichiers)
        run: |
          # Les vidéos et visuels complets, pour que Claude puisse les renvoyer sans le zip.
          cp -r out/semaine /tmp/semaine
          git checkout --orphan semaine-fichiers
          git rm -rfq --cached .
          git clean -fdq -e out
          cp -r /tmp/semaine/* .
          git add -- *.mp4 *.png *.md carrousel
          git commit -qm "Fichiers de la semaine du $(date -u +%F) (run ${{ github.run_number }})"
          git push -f origin semaine-fichiers

name: Logos (récupération)
on:
  workflow_dispatch:
    inputs:
      marques:
        description: "slug=Nom=site, séparés par des virgules (ex. cdiscount=Cdiscount=cdiscount.com)"
        required: true
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Récupérer les logos
        env: { MARQUES: "${{ inputs.marques }}" }
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/reels")
          import logos
          for item in os.environ["MARQUES"].split(","):
              slug, name, site = [x.strip() for x in item.split("=")]
              res = logos.fetch_with_source(name, site, slug=slug)
              img, src = (res if isinstance(res, tuple) else (res, "?"))
              if img is None:
                  print("AUCUN", slug); continue
              img.save(f"out/{slug}.png"); print(slug, img.size, src)
          PY
      - name: Publier sur une branche de fichiers (logos-<n°>)
        run: |
          cd out
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git init -q -b logos && git add -A
          git -c user.name=backed-bot -c user.email=bot@backed.fr commit -qm "Logos ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logos:logos-${{ github.run_number }}

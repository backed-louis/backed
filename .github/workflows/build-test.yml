name: Test du build du site

# Reproduit le build Vercel (npm run build) avec les vraies données Airtable, pour lire ses erreurs.
on:
  push:
    branches: [builds-fiables]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Commande « ignorer le build » de vercel.json (0 = ignoré, 1 = build)
        run: |
          set +e
          git diff --quiet HEAD^ HEAD -- . ':(exclude)scripts' ':(exclude).github' ':(exclude)*.md'
          echo "code de sortie : $?"
      - name: Build
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

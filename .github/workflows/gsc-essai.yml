name: Search Console (essai)
on:
  push:
    branches: [gsc]
permissions:
  contents: read
jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet Pillow==11.3.0 numpy==2.1.3 google-auth==2.38.0 requests==2.32.3
      - env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          cd scripts/reels
          python3 - <<'PY'
          import datetime as dt, generate_week as g
          t = g.trends_search_console()
          print("marques en hausse :", None if t is None else len(t))
          data = g.load_from_airtable()
          today = dt.date.today()
          end = (g.next_sunday(today) + dt.timedelta(days=5)).isoformat()
          daily, top, *_, missing = g.pick_offers(data, today, valid_until=end, trending=t)
          print("top 3 :", [o["brand"] for o in top])
          print("codes du jour :", [o["brand"] for o in daily])
          print("sans code :", len(missing))
          PY

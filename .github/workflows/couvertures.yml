name: Couvertures (vidéos déjà publiées)

# Refait les vidéos « Code du jour » de marques imposées (« Marque:CODE », offres actives) sans toucher aux branches
# de fichiers, puis garde leur première image : la couverture créateur + marque + remise, à importer dans TikTok
# Studio pour une vidéo déjà publiée. Résultat : l'artefact « couvertures-<n> ».
on:
  workflow_dispatch:
    inputs:
      marques:
        description: 'Marque:CODE séparés par des virgules'
        required: true

jobs:
  couvertures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet Pillow==11.3.0 numpy==2.1.3 scipy==1.14.1 playwright==1.49.1 google-auth==2.38.0 requests==2.32.3 cairosvg==2.7.1
          python -m playwright install --with-deps chromium
      - name: Vidéos puis couvertures
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MARQUES: ${{ github.event.inputs.marques }}
        run: |
          python3 scripts/reels/generate_week.py --out out/v --preview out/p --start 2026-11-22 --marques "$MARQUES"
          mkdir -p out/couvertures
          for f in out/v/*.mp4; do
            ffmpeg -nostdin -loglevel error -y -i "$f" -frames:v 1 -q:v 2 "out/couvertures/$(basename "${f%.mp4}").jpg"
          done
          cp out/v/publications.md out/couvertures/
          ls out/couvertures
      - uses: actions/upload-artifact@v4
        with:
          name: couvertures-${{ github.run_number }}
          path: out/couvertures
          retention-days: 14

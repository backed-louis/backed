name: Ajouter des créateurs

# Actions → Ajouter des créateurs → Run workflow, puis coller les @pseudos YouTube
# séparés par des virgules (ex. "@Michou, @Domingo"). Le résultat s'affiche dans le résumé du run.
on:
  workflow_dispatch:
    inputs:
      creators:
        description: '@pseudos YouTube (ou noms de chaîne), séparés par des virgules'
        required: true
      min_abonnes:
        description: "Nombre minimum d'abonnés"
        required: false
        default: '40000'

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ajouter les créateurs
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORS: ${{ github.event.inputs.creators }}
          MIN_SUBSCRIBERS: ${{ github.event.inputs.min_abonnes }}
        run: node scripts/add-creators.js

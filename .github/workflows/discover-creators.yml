name: Découvrir des créateurs

# Actions → Découvrir des créateurs → Run workflow.
# Le classement s'affiche dans le résumé du run et se télécharge en bas (Artifacts, .md et .csv).
# Avec « chaines » rempli : inspection détaillée de ces chaînes seulement (inspection.md).
# Classement : sponsos réguliers × audience × vues/abonnés. Chaînes de scripts/creators/exclus.txt ignorées.
# Coût : ~1 400 unités de quota YouTube + 2 par chaîne étudiée + 1 à 100 par nom de candidats.txt (plafond 7 500).
on:
  workflow_dispatch:
    inputs:
      min_abonnes:
        description: "Nombre minimum d'abonnés"
        required: false
        default: '40000'
      jours:
        description: 'Vidéos publiées depuis combien de jours'
        required: false
        default: '45'
      pays:
        description: 'Pays acceptés, codes séparés par des virgules (FR, ou FR,BE,CH,CA pour la francophonie)'
        required: false
        default: 'FR'
      avec_liste:
        description: 'Noter aussi les créateurs de scripts/creators/candidats.txt (true/false)'
        required: false
        default: 'true'
      chaines:
        description: "Inspecter seulement ces chaînes (@pseudos, UC… ou noms, séparés par des virgules) : dernières vidéos et lignes sponsor"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Découvrir
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MIN_SUBSCRIBERS: ${{ github.event.inputs.min_abonnes }}
          DAYS: ${{ github.event.inputs.jours }}
          WITH_CANDIDATES: ${{ github.event.inputs.avec_liste }}
          COUNTRIES: ${{ github.event.inputs.pays }}
          CHANNELS: ${{ github.event.inputs.chaines }}
        run: node scripts/discover-creators.js
      - name: Classement à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: decouverte-createurs-${{ github.run_number }}
          path: out/decouverte
          retention-days: 30
      - name: Garder le classement dans le dépôt (branche decouverte-resultats)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r out/decouverte /tmp/decouverte
          # On remplace seulement les fichiers produits par ce run : une inspection garde le dernier classement.
          git fetch origin decouverte-resultats
          git checkout -B decouverte-resultats FETCH_HEAD
          cp /tmp/decouverte/* .
          git add -- *.md *.csv
          git commit -qm "Découverte du $(date -u +%F)" || echo "Rien de nouveau"
          git push origin decouverte-resultats

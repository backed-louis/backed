     moteur.py injecte les polices (FONTS), le style et les outils communs (COMMUN_CSS, COMMUN_JS) et l'épisode (DATA). -->

<style>

/*COMMUN_CSS*/

/* notification du créateur */

#notif .a { font: 700 20px var(--mono); letter-spacing: .2em; color: var(--grey); white-space: nowrap; }

/* tampon */
#stamp { position: absolute; left: 0; top: 0; display: none; padding: 8px 30px 14px; border: 10px solid #ff4d6d; border-radius: 24px; color: #ff4d6d; white-space: nowrap;

.msg { position: absolute; left: 0; width: 1040px; text-align: center; font-family: var(--syne); font-weight: 800; letter-spacing: -.02em; white-space: nowrap; opacity: 0; }
#ne2 { font-family: var(--inter); font-weight: 600; letter-spacing: 0; color: var(--lilas); }

/* Gérard */
#ger { position: absolute; left: 220px; top: 880px; width: 600px; height: 700px; overflow: visible; }
.star { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; background: #ffd34d; opacity: 0;
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 12px rgba(255,211,77,.8)); }
</style>

<script>
window.DATA = /*DATA*/{
  episode: 1, createur: "Jojol", code: "MAGGO2PRO", marque: "Anker", produit: "Batterie externe MagGo 2 Pro",
  prix: "109,99 €", prixCode: "87,99 €", gain: "22 €", logo: null, logoStyle: "pad"
}/*END*/;
/*COMMUN_JS*/

const D = window.DATA;
const T = { tap: 2.3, paid: 2.4, notif: 3.55, shock: 3.85, strike: 4.25, newp: 4.55, stamp: 4.95, end4: 5.85, ne: 6.0,
            flash: 6.85, outro: 7.05, end: 10.05 };
window.DUREE = T.end; window.CUTS = [0, T.notif, T.end4, T.outro, T.end]; window.OUTRO_T = T.outro; window.CLICKS = [T.tap, T.notif, T.stamp];
const L = {};
const STARS = [[255, 1005], [790, 975], [215, 1215], [835, 1190]];

function setup() {
  $("hk").textContent = `GÉRARD PLEINPOT · ÉPISODE ${D.episode}`;
  $("h1").innerHTML = "POV : Gérard n'a pas vu";
  $("h2").innerHTML = `le code ${esc(de(D.createur)).replace(esc(D.createur), `<span class="hl">${esc(D.createur)}</span>`)}.`;
  const hs = Math.min(fitSize($("h1"), 860, 84), fitSize($("h2"), 860, 84));
  $("h1").style.fontSize = $("h2").style.fontSize = hs + "px";
  $("hk").style.top = "318px"; $("h1").style.top = "368px"; $("h2").style.top = (368 + hs * 1.1) + "px";
  $("hk").style.fontSize = Math.min(26, fitSize($("hk"), 860, 26)) + "px";

  $("ctile").innerHTML = tileHTML(D.logo, D.marque, 92, D.logoStyle);
  $("ck").textContent = `TON PANIER · ${D.marque.toUpperCase()}`;
  $("cprod").textContent = D.produit;
  $("cprod").style.fontSize = Math.min(34, fitSize($("cprod"), 540, 34)) + "px";
  $("ptx").textContent = D.prix;
  $("paytx").textContent = `Payer ${D.prix}`;
  $("paycd").innerHTML = `<span>Avec le code ${esc(de(D.createur))} :</span><b>${esc(D.prixCode)}</b>`;

  $("nav").textContent = D.createur.slice(0, 1).toUpperCase();
  $("na").textContent = `YOUTUBE · ${D.createur.toUpperCase()} · À L'INSTANT`;
  $("nb").innerHTML = `Code <i>${esc(D.code)}</i> : −${esc(D.gain)}`;
  $("nc").textContent = `sur la ${D.produit.replace(/^Batterie externe /, "batterie ")}`;
  $("nb").style.fontSize = Math.min(38, fitSize($("nb"), 600, 38)) + "px";
  $("nc").style.fontSize = Math.min(28, fitSize($("nc"), 600, 28)) + "px";

  $("stamp").textContent = `${D.gain} DE TROP`;
  show($("stamp"), true);   // caché par défaut : il faut l'afficher pour le mesurer
  $("stamp").style.fontSize = Math.min(96, fitSize($("stamp"), 620, 96)) + "px";
  show($("stamp"), false);
  const ns = Math.min(fitSize($("ne1"), 860, 100), 100);
  $("ne1").style.fontSize = ns + "px";
  $("ne2").style.fontSize = Math.min(44, fitSize($("ne2"), 820, 44)) + "px";
  $("ne1").style.top = "430px"; $("ne2").style.top = (430 + ns * 1.25) + "px";
}

function measure() {
  L.btn = $("pay").getBoundingClientRect();
  L.priceW = $("ptx").getBoundingClientRect().width;
  const c = $("cart").getBoundingClientRect();
  show($("stamp"), true);
  L.stX = CX - $("stamp").offsetWidth / 2; L.stY = c.top + 80 - $("stamp").offsetHeight / 2;   // sur la ligne du produit : le prix barré et le nouveau prix restent lisibles
  show($("stamp"), false);
}

const MOUTH = {
  smug: ["M262 410 Q292 420 336 398", "none", 8],
  joy: ["M250 398 Q300 466 350 398 Q300 418 250 398 Z", "#6b1d2a", 6],
  shock: ["M300 390 C 318 390 327 406 327 424 C 327 444 316 456 300 456 C 284 456 273 444 273 424 C 273 406 282 390 300 390 Z", "#6b1d2a", 6],
  sad: ["M264 432 Q300 404 336 432", "none", 8],
};
// sourcils : [décalage vertical, angle] pour le gauche puis le droit
const BROWS = { smug: [[-18, 0], [4, -9]], joy: [[-12, 0], [-12, 0]], shock: [[-28, -7], [-28, 7]], sad: [[-6, -15], [-6, 15]] };

function renderGerard(t) {
  const e = t < T.paid ? "smug" : t < T.shock ? "joy" : t < T.end4 + .05 ? "shock" : "sad";
  const inP = eo(prog(t, -.3, .7)), out = eio(prog(t, T.flash - .1, .3));
  const jump = e === "joy" ? Math.abs(Math.sin((t - T.paid) * 8)) * 26 * (1 - prog(t, T.paid, 1.1)) : 0;
  const droop = eio(prog(t, T.end4, .5)) * 30;
  $("ger").style.opacity = .6 + .4 * inP - out;
  $("ger").style.transform = `translateY(${(1 - inP) * 50 - jump + droop + out * 80}px)`;

  const sh = e === "shock" ? Math.sin((t - T.shock) * 40) * 7 * (1 - prog(t, T.shock, .8)) : 0;
  const tilt = e === "smug" ? -5 + Math.sin(t * 2.2) * 1.5 : e === "joy" ? Math.sin((t - T.paid) * 9) * 3.5 : e === "sad" ? 6 * eio(prog(t, T.end4, .4)) : 0;
  $("headg").setAttribute("transform", `rotate(${tilt + sh} 300 470)`);

  // yeux
  show($("eyesOpen"), e !== "joy"); show($("eyesHappy"), e === "joy");
  const big = e === "shock" ? 1 + .4 * back(prog(t, T.shock, .25)) : 1;
  for (const [s, cx] of [["L", 242], ["R", 358]]) {
    $("w" + s).setAttribute("rx", 24 * big); $("w" + s).setAttribute("ry", 25 * big);
    let px = cx, py = 294, pr = 10;
    if (e === "smug") px += 8;
    if (e === "shock") pr = 6;
    if (e === "sad") { py += 10; px += s === "L" ? 4 : -4; pr = 9; }
    $("p" + s).setAttribute("cx", px); $("p" + s).setAttribute("cy", py); $("p" + s).setAttribute("r", pr);
    $("lid" + s).setAttribute("height", e === "smug" ? 22 : e === "sad" ? 13 : 0);
  }
  const bump = e === "shock" ? Math.sin(Math.PI * prog(t, T.shock, .3)) : 0;
  $("glasses").setAttribute("transform", `translate(0 ${-22 * bump})`);
  BROWS[e].forEach(([dy, a], k) => {
    const cx = k ? 359 : 241, lift = e === "shock" ? (1 - back(prog(t, T.shock, .25))) * 20 : 0;
    $(k ? "browR" : "browL").setAttribute("transform", `translate(0 ${dy + lift}) rotate(${a} ${cx} 216)`);
  });
  const [d, fill, sw] = MOUTH[e];
  const m = $("mouth");
  m.setAttribute("d", d); m.setAttribute("fill", fill); m.setAttribute("stroke-width", sw);
  m.setAttribute("transform", e === "shock" ? `translate(300 424) scale(${.6 + .4 * back(prog(t, T.shock, .25))}) translate(-300 -424)` : "");
  const blush = e === "joy" ? .6 : e === "shock" ? .12 : .35;
  $("chL").setAttribute("opacity", blush); $("chR").setAttribute("opacity", blush);
  const sw2 = prog(t, T.shock + .1, 1.6);
  $("sweat").setAttribute("opacity", e === "shock" || e === "sad" ? clamp(sw2 * 4) : 0);
  $("sweat").setAttribute("transform", `translate(438 ${200 + 70 * sw2})`);

  // bras et carte : la carte s'agite (paiement), puis tombe ; le bras retombe
  const wave = e === "joy" ? Math.sin((t - T.paid) * 14) * 9 * (1 - prog(t, T.paid, 1)) : Math.sin(t * 2.4) * 2;
  const drop = eio(prog(t, T.shock + .05, .5));
  $("armg").setAttribute("transform", `rotate(${wave + drop * 16} 462 590)`);
  const fall = prog(t, T.shock, .75);
  $("card").setAttribute("transform", fall > 0 ? `translate(${fall * 40} ${Math.pow(fall, 2) * 700}) rotate(${fall * 120} 560 400)` : "");
  $("card").setAttribute("opacity", 1 - prog(t, T.shock + .5, .25));

  // étoiles de fierté
  STARS.forEach(([x, y], k) => {
    const p = prog(t, T.paid + k * .07, .8), el = $("s" + (k + 1));
    el.style.left = x + "px"; el.style.top = (y - jump) + "px";
    el.style.opacity = p > 0 && p < 1 ? Math.sin(p * Math.PI) : 0;
    el.style.transform = `scale(${.4 + .8 * Math.sin(p * Math.PI)}) rotate(${p * 90}deg)`;
  });
}

function render(t) {
  renderBackground(t, t > T.outro ? .95 : .6);
  const on = t < T.flash + .3;
  show($("scene"), on);
  if (on) {
    // accroche : lisible dès la 1re image, puis s'efface quand la notification arrive
    const s0 = eo(prog(t, -.3, .6)), hq = eio(prog(t, T.notif - .1, .3));
    ["hk", "h1", "h2"].forEach((id, k) => {
      const el = $(id);
      el.style.opacity = (.7 + .3 * s0) * (1 - hq);
      el.style.transform = `translateY(${(1 - s0) * 18 - hq * 70}px)`;
      blur(el, hq * 10);
    });
    // panier
    const cIn = eo(prog(t, -.3, .7)), cOut = eio(prog(t, T.end4, .45));
    const shake = t > T.stamp ? Math.sin((t - T.stamp) * 55) * 12 * (1 - prog(t, T.stamp, .4)) : 0;
    $("cart").style.opacity = (.7 + .3 * cIn) * (1 - cOut);
    $("cart").style.transform = `translate(${shake}px, ${(1 - cIn) * 26 + Math.sin(t * 1.6) * 5 - cOut * 90}px) scale(${(.97 + .03 * cIn) * (1 - cOut * .06)})`;
    blur($("cart"), cOut * 10);
    const ok = eo(prog(t, T.tap + .05, .25));
    $("payok").style.opacity = ok; $("payok").style.transform = `scale(${t > T.tap ? .92 + .08 * back(ok) : 1})`;
    const pc = eo(prog(t, T.newp, .35));
    $("paycd").style.opacity = pc; $("paycd").style.transform = `scale(${.9 + .1 * back(pc)})`;
    $("strike").style.width = (eio(prog(t, T.strike, .3)) * (L.priceW + 16)) + "px";
    $("ptx").style.color = t > T.strike + .15 ? "#8c8fa3" : "";
    // notification
    show($("notif"), t > T.notif - .02);
    const nIn = back(prog(t, T.notif, .5), 1.3), nOut = eio(prog(t, T.end4, .45));
    $("notif").style.opacity = clamp(prog(t, T.notif, .15) * 1.2) * (1 - nOut);
    $("notif").style.transform = `translateY(${(1 - nIn) * -320 - nOut * 90}px) scale(${1 - nOut * .05})`;
    blur($("notif"), nOut * 10);
    // tampon
    show($("stamp"), t > T.stamp);
    const sp = prog(t, T.stamp, .2);
    $("stamp").style.opacity = clamp(sp * 2.5) * (1 - nOut);
    $("stamp").style.transform = `translate(${L.stX + shake}px, ${L.stY - cOut * 90}px) rotate(-9deg) scale(${lerp(2.6, 1, eo(sp))})`;
    blur($("stamp"), cOut * 10);
    // « Ne sois pas Gérard. »
    [["ne1", T.ne], ["ne2", T.ne + .18]].forEach(([id, at]) => {
      const p = expo(prog(t, at, .5)), q = eio(prog(t, T.flash - .1, .3));
      $(id).style.opacity = p * (1 - q);
      $(id).style.transform = `translateY(${(1 - p) * 40 - q * 60}px)`;
      blur($(id), (1 - p) * 10 + q * 10);
    });
    renderGerard(t);
  }
  renderFinger(t, [[T.tap, L.btn]]);
  renderFlash(t, T.flash);
  renderOutro(t, T.outro);
}

boot();
</script>

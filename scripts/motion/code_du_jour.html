<!-- Vidéo premium « Code du jour » : 1080×1920, ~9,7 s. Accroche (« Code du jour » + logo et marque, puis une carte
     premium en 3D avec l'avantage et le code à moitié masqué) ; la même carte se redresse, le code se dévoile et il est copié,
     le code s'envole et se colle au paiement, fin Backed.
     moteur.py injecte les polices (FONTS), le style et les outils communs (COMMUN_CSS, COMMUN_JS) et l'offre (DATA). -->
<meta charset="utf-8">
<style>
/*FONTS*/
/*COMMUN_CSS*/
/* accroche : en-tête, puis la carte premium (avantage + code à moitié masqué) */
#head { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 24px; }
#head .lab { font: 700 24px var(--mono); letter-spacing: .34em; color: var(--lilas); white-space: nowrap; }
#head .br { font-family: var(--syne); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; margin-top: 4px; }
#hstage { position: absolute; inset: 0; perspective: 1900px; }
#hcard { position: absolute; left: 120px; width: 800px; border-radius: 48px; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 80% at 92% 0%, rgba(178,102,255,.55), rgba(139,0,255,0) 60%),
    radial-gradient(ellipse 60% 70% at 0% 100%, rgba(80,30,160,.5), rgba(80,30,160,0) 65%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, rgba(255,255,255,0) 2px 9px),
    linear-gradient(135deg, #1e1238 0%, #120d22 45%, #0b0b14 100%);
  box-shadow: 0 0 0 1.5px rgba(200,160,255,.45) inset, 0 70px 130px rgba(0,0,0,.7), 0 0 160px rgba(139,0,255,.38); }
#hshine { position: absolute; top: -60%; width: 220px; height: 220%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.2), rgba(255,255,255,0)); transform: rotate(20deg); }
#hhero { position: absolute; left: 54px; top: 50px; display: flex; align-items: flex-start; white-space: nowrap; }
#hhero .n { font-family: var(--syne); font-weight: 800; letter-spacing: -.05em; line-height: .9; padding: 0 .02em .06em 0; }
#hhero .u { font-family: var(--syne); font-weight: 800; line-height: 1; margin-left: .04em; }
#hhero .txt { font-family: var(--syne); font-weight: 800; letter-spacing: -.02em; line-height: 1.04; padding-bottom: .05em; }
#hrest { position: absolute; left: 56px; width: 692px; font: 600 40px var(--inter); color: #d6d3e4; line-height: 1.25; }
#hchip { position: absolute; right: 50px; bottom: 50px; padding: 14px 22px; border-radius: 16px; font: 700 32px var(--mono); letter-spacing: .1em; transform-origin: 100% 100%; min-width: 250px; text-align: center;
  background: rgba(0,0,0,.38); border: 1.5px solid rgba(200,160,255,.5); color: var(--off); white-space: nowrap; }
#hcode i, #hcode b { font-style: normal; font-weight: 700; color: var(--lilas); }
#hchip .ok { position: absolute; inset: -1.5px; display: flex; align-items: center; justify-content: center; border-radius: 16px; opacity: 0;
  background: #11331f; border: 1.5px solid rgba(76,217,100,.6); color: var(--green2); font: 700 32px var(--mono); letter-spacing: .04em; }
#hfloor { position: absolute; left: 170px; width: 700px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse, rgba(139,0,255,.5), rgba(139,0,255,0) 70%); filter: blur(20px); }
#ck { position: absolute; left: 140px; top: 470px; width: 760px; border-radius: 44px; transform-origin: 380px 220px; padding: 42px 46px 44px; display: none;
  background:
    radial-gradient(ellipse 70% 80% at 92% 0%, rgba(178,102,255,.4), rgba(139,0,255,0) 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.022) 0 2px, rgba(255,255,255,0) 2px 9px),
    linear-gradient(135deg, #1b1233 0%, #110d20 45%, #0b0b14 100%);
  box-shadow: 0 0 0 1.5px rgba(200,160,255,.4) inset, 0 60px 120px rgba(0,0,0,.65), 0 0 140px rgba(139,0,255,.28); }
#ck .k { color: #c9b3ef; }
#field { background: rgba(7,8,15,.75); }
#ck .k { font: 700 22px var(--mono); letter-spacing: .26em; color: var(--grey); white-space: nowrap; overflow: hidden; }
#ck .row { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; }
#field { flex: 1; height: 86px; border-radius: 18px; background: var(--night); border: 2px solid var(--line); position: relative; margin-right: 16px; }
#field .ph { position: absolute; left: 26px; top: 25px; font: 500 27px var(--inter); color: #5c5f75; }
#field .tx { position: absolute; left: 26px; top: 23px; font: 700 30px var(--mono); letter-spacing: .08em; color: var(--off); white-space: nowrap; }
#apply { width: 196px; height: 86px; border-radius: 18px; background: var(--vio); display: flex; align-items: center; justify-content: center; font: 700 27px var(--inter); position: relative; overflow: hidden; }
#apply .ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--green); font-size: 36px; opacity: 0; }
#res { color: var(--green2); font: 700 30px var(--inter); overflow: hidden; }
#resv { font-family: var(--syne); font-weight: 800; font-size: 46px; }
.msg { position: absolute; left: 0; width: 1040px; text-align: center; font-family: var(--syne); font-weight: 800; letter-spacing: -.02em; white-space: nowrap; opacity: 0; }
</style>

<div id="frame">
  <div id="hook">
    <div id="head"></div>
    <div id="hfloor"></div>
    <div id="hstage"><div id="hcard"><div id="hshine"></div><div id="hhero"></div><div id="hrest"></div><div id="hchip"></div></div></div>
  </div>
  <div class="st" id="st2"><div class="n" id="st2n"></div><div class="t">Le code à copier</div></div>
  <div class="st" id="st3"><div class="n">AU PAIEMENT</div><div class="t">Colle-le, c'est appliqué</div></div>
  <div id="ck">
    <div class="k" id="ckk"></div>
    <div class="row"><div id="field"><div class="ph" id="fph">Code promo</div><div class="tx" id="ftx"></div></div><div id="apply">Appliquer<div class="ok" id="applyok">✓</div></div></div>
    <div class="row" id="res"><span>✓ Code appliqué</span><span id="resv"></span></div>
  </div>
  <div class="msg" id="msg1">Tu paies moins.</div><div class="msg" id="msg2" style="color:var(--lilas)"></div>
  <div id="fly"></div>
  <div id="ripple"></div><div id="finger"></div>
  <div id="outro"></div>
</div>

<script>
window.DATA = /*DATA*/{
  marque: "Delko", code: "SYLVAIN15", createur: "Sylvain Lyve", avantage: "-15 % sur l'entretien de votre voiture",
  gainBig: "-15 %", gainText: "", logo: null, logoStyle: "pad", remise: 15
}/*END*/;
/*COMMUN_JS*/

const D = window.DATA;
const T = { hookOut: 1.35, cardIn: 1.6, st2: 1.75, reveal: 2.0, tap: 2.85, lift: 3.0, recede: 3.1, exit: 3.65, ckIn: 3.75, st3: 3.9,
            dive: 4.25, land: 4.7, apply: 4.8, res: 4.9, msg: 5.05, ckOut: 5.95, flash: 6.05, outro: 6.3, end: 9.7 };
window.DUREE = T.end; window.CUTS = [0, T.cardIn, T.ckIn, T.outro, T.end]; window.OUTRO_T = T.outro; window.CLICKS = [T.tap, T.land];
const L = {};
const S2 = 1.08, CY2 = 860, CHIP2 = 1.3;   // la carte redressée à l'écran 2 : échelle, centre, et le code agrandi
const GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";

// le code sur la carte : la 1re moitié visible, la 2de masquée, qui se dévoile lettre par lettre (en brouillant) à T.reveal
function codeHTML(t) {
  const c = D.code; let out = esc(c.slice(0, L.vis));
  for (let k = 0; k < L.hidden; k++) {
    const a = T.reveal + k * .05;
    if (t >= a + .16) out += esc(c[L.vis + k]);
    else if (t >= a) out += `<b>${GLYPHS[(Math.floor(t * 30) * 7 + k * 13) % GLYPHS.length]}</b>`;
    else out += "<i>•</i>";
  }
  return out;
}

function balanced(el, text, maxw, max) {
  // une ligne si elle tient assez grande, sinon deux lignes les plus égales possible
  el.textContent = text; const one = fitSize(el, maxw, max);
  const ws = text.split(" ");
  if (one >= max * .72 || ws.length < 2) return [text];
  let best = null;
  for (let k = 1; k < ws.length; k++) {
    const a = ws.slice(0, k).join(" "), b = ws.slice(k).join(" ");
    el.textContent = a; const wa = textWidth(el); el.textContent = b; const wb = textWidth(el);
    const m = Math.max(wa, wb);
    if (!best || m < best[0]) best = [m, [a, b]];
  }
  return best[1];
}

// « -15 % sur la livraison » → { hero: "−15 %", rest: "sur la livraison" } ; sans chiffre en tête : { hero: "", rest: phrase }
function gainParts() {
  const src = (D.gainBig ? (D.avantage || D.gainBig) : (D.gainText || D.avantage || D.marque)).replace(/\s*\([^)]*\)/g, "").trim();
  const m = src.match(/^([-−]?\s?\d+(?:[.,]\d+)?\s?%|[-−]\s?\d+(?:[.,]\d+)?\s?€|\d+(?:[.,]\d+)?\s?€)\s*(.*)$/i);
  const nb = h => { h = h.replace(/\s+/g, ""); if (/%$/.test(h) && !/^[-−]/.test(h)) h = "−" + h;
    return h.replace(/^-/, "−").replace(/([%€])$/, "\u202f$1"); };
  const tidy = r => r.replace(/^(de\s+)?(réduction|remise|réduc)\s*/i, "").replace(/[ .]+$/, "");
  if (m) return { hero: nb(m[1]), rest: tidy(m[2]) };
  if (D.gainBig) return { hero: nb(D.gainBig), rest: src.length <= 60 ? tidy(src) : "" };
  return { hero: "", rest: src };
}

function setup() {
  // en-tête : logo, « CODE DU JOUR », marque
  $("head").innerHTML = `${tileHTML(D.logo, D.marque, 112, D.logoStyle)}<div><div class="lab">CODE DU JOUR</div><div class="br" id="hbr">${esc(D.marque)}</div></div>`;
  $("hbr").style.fontSize = Math.min(58, fitSize($("hbr"), 620, 58)) + "px";
  $("head").style.left = (CX - $("head").offsetWidth / 2) + "px";
  // la carte : l'avantage (« −15 % » en grand + « sur la livraison », ou la phrase en grand) et le code à moitié masqué
  const g = gainParts(), PAD = 52, W = 692;
  let y = PAD;
  if (g.hero) {
    const m = g.hero.match(/^(.*?)\s*([%€])$/) || [0, g.hero, ""];
    $("hhero").innerHTML = `<span class="n grad">${esc(m[1])}</span>${m[2] ? `<span class="u grad"${m[2] === "€" ? ' style="font-family:var(--inter)"' : ""}>${m[2]}</span>` : ""}`;
    const n = $("hhero").querySelector(".n"), u = $("hhero").querySelector(".u");
    const size = (sz) => { n.style.fontSize = sz + "px"; if (u) { u.style.fontSize = sz * .46 + "px"; u.style.marginTop = sz * .1 + "px"; } return $("hhero").getBoundingClientRect().width; };
    const hs = Math.min(250, 100 * 640 / size(100)); size(hs);
    y += hs * .96;
    if (g.rest) {
      $("hrest").textContent = g.rest;
      let rs = 40; $("hrest").style.fontSize = rs + "px";
      while ($("hrest").offsetHeight > rs * 1.25 * 2 + 2 && rs > 28) { rs -= 2; $("hrest").style.fontSize = rs + "px"; }
      y += 10; $("hrest").style.top = y + "px"; y += $("hrest").offsetHeight;
    }
  } else {
    $("hhero").innerHTML = `<span class="txt grad"></span>`; const el = $("hhero").firstChild;
    const ls = balanced(el, g.rest, W, 116);
    const hs = Math.min(116, ...ls.map(x => { el.textContent = x; return fitSize(el, W, 116); }));
    el.innerHTML = ls.map(esc).join("<br>"); el.style.fontSize = hs + "px";
    y += ls.length * hs * 1.04;
  }
  L.vis = Math.min(D.code.length, Math.max(2, Math.ceil(D.code.length / 2))); L.hidden = D.code.length - L.vis;
  $("hchip").innerHTML = `<span id="hcode">${codeHTML(0)}</span><div class="ok">✓ Copié !</div>`;
  const cardH = Math.round(y + 62 + $("hchip").offsetHeight + 50);
  $("hcard").style.height = cardH + "px"; $("hcard").style.transformOrigin = `400px ${cardH / 2}px`;
  // en-tête + carte centrés ensemble dans la zone sûre
  const HEAD = 112, GAP = 92, top = Math.round(300 + Math.max(0, (1060 - HEAD - GAP - cardH) / 2) - 20);
  $("head").style.top = top + "px";
  const ct = top + HEAD + GAP;
  $("hcard").style.top = ct + "px"; $("hstage").style.perspectiveOrigin = `520px ${ct + cardH / 2}px`;
  $("hfloor").style.top = (ct + cardH + 10) + "px";
  L.dy2 = CY2 - (ct + cardH / 2);   // déplacement de la carte vers son centre de l'écran 2
  // code, paiement
  $("st2n").textContent = D.createur ? `PARTAGÉ PAR ${D.createur.toUpperCase()}` : `CODE ${D.marque.toUpperCase()}`;
  ["st2", "st3"].forEach(id => { const t = $(id).querySelector(".t"); t.style.fontSize = fitSize(t, 790, 64) + "px"; const n = $(id).querySelector(".n"); n.style.fontSize = Math.min(26, fitSize(n, 790, 26)) + "px"; });
  $("fly").textContent = D.code;
  $("ckk").textContent = `TON PANIER · ${D.marque.toUpperCase()}`;
  $("resv").textContent = D.remise ? `−${D.remise} %` : "";
  if (D.createur) $("msg2").textContent = `Et tu soutiens ${D.createur}.`;
  const ms = Math.min(fitSize($("msg1"), 790, 70), D.createur ? fitSize($("msg2"), 790, 70) : 70);
  $("msg1").style.fontSize = $("msg2").style.fontSize = ms + "px";
  L.ms = ms;
}

function measure() {
  // le code sur la carte redressée (écran 2) : là où le doigt appuie et d'où il s'envole
  $("hcard").style.transform = `translateY(${L.dy2}px) scale(${S2})`; $("hchip").style.transform = `scale(${CHIP2})`;
  L.btn = $("hchip").getBoundingClientRect();
  $("hcard").style.transform = $("hchip").style.transform = "none";
  $("fly").style.display = "block"; L.flyW = $("fly").offsetWidth; L.flyH = $("fly").offsetHeight; $("fly").style.display = "none";
  const ck = $("ck"); ck.style.display = "block"; ck.style.transform = "none";
  const h = ck.offsetHeight;
  // la carte du paiement et les deux phrases dessous, centrées ensemble dans la zone sûre
  const group = h + 70 + (D.createur ? 2 : 1) * L.ms * 1.15;
  const top = Math.round(460 + Math.max(0, (1330 - 460 - group) / 2));
  ck.style.top = top + "px";
  L.ckBottom = top + h;
  const ft = $("ftx"); ft.textContent = D.code; L.ftx = ft.getBoundingClientRect(); ft.textContent = "";
  ck.style.display = "none";
  $("msg1").style.top = (L.ckBottom + 70) + "px";
  $("msg2").style.top = (L.ckBottom + 70 + L.ms * 1.15) + "px";
}

function render(t) {
  renderBackground(t, t > T.outro ? .95 : .6);

  // ---------- la carte : elle flotte en 3D (accroche, lisible dès la 1re image), puis se redresse au centre,
  // le code se dévoile et il est copié (écran 2), puis elle recule et tombe
  const cardOn = t < T.exit + .7;
  show($("hook"), cardOn);
  if (cardOn) {
    const q = eio(prog(t, T.hookOut, .4)), s0 = eo(prog(t, -.25, .5));
    $("head").style.opacity = (.75 + .25 * s0) * (1 - q);
    $("head").style.transform = `translateY(${(1 - s0) * 16 - q * 120}px)`; blur($("head"), q * 10);
    const f = eo(prog(t, -.25, 1.7)), p = eio(prog(t, T.hookOut, .75));
    const rec = eio(prog(t, T.recede, .6)), ex = Math.pow(prog(t, T.exit, .6), 3);
    const ry = lerp(-16 + 12 * f + Math.sin(t * 1.3) * 1.2, 0, p), rx = lerp(12 - 7 * f, 0, p), rz = lerp(-2.5 + 2 * f, 0, p) - ex * 6;
    const ty = lerp(Math.sin(t * 1.8) * 6, L.dy2, p) + rec * 90 + ex * 1200, sc = lerp(1, S2, p) * (1 - rec * .12);
    $("hcard").style.transform = `translateY(${ty}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`;
    $("hcard").style.opacity = 1 - eio(prog(t, T.exit + .2, .4));
    $("hcard").style.filter = rec > .01 ? `blur(${rec * 6}px) brightness(${1 - rec * .5})` : "none";
    // un reflet traverse la carte à l'accroche, puis de nouveau quand le code se dévoile
    const first = t < T.hookOut + .3;
    $("hshine").style.left = (-300 + 1450 * (first ? eio(prog(t, .1, 1.15)) : eio(prog(t, T.reveal - .15, .9)))) + "px";
    $("hhero").querySelectorAll(".grad").forEach(el => first ? sweep(el, t, .25, 1.0) : sweep(el, t, T.reveal, .9));
    $("hfloor").style.transform = `translateY(${lerp(0, L.dy2, p) + rec * 90}px)`;
    $("hfloor").style.opacity = (.85 + .15 * Math.sin(t * 2)) * (1 - rec);
    // le code se dévoile, s'illumine, puis « ✓ Copié ! »
    $("hcode").innerHTML = codeHTML(t);
    const done = T.reveal + L.hidden * .05 + .16, gl = Math.sin(Math.PI * prog(t, done - .05, .5));
    $("hchip").style.transform = `scale(${lerp(1, CHIP2, p) * (1 + .07 * gl)})`;
    $("hchip").style.borderColor = t > T.reveal ? "rgba(214,180,255,.95)" : "";
    $("hchip").style.boxShadow = t > T.reveal ? `0 0 ${30 + 40 * gl}px rgba(139,0,255,${.45 + .35 * gl}), 0 0 0 ${6 * gl}px rgba(178,102,255,.25)` : "";
    const ok = $("hchip").querySelector(".ok"), cp = eo(prog(t, T.tap, .25));
    ok.style.opacity = t >= T.tap ? cp : 0;
    ok.style.transform = `scale(${t >= T.tap ? .9 + .1 * back(cp) : 1})`;
  }

  // ---------- titres d'étape
  renderStep($("st2"), t, T.st2, T.st3 - .15);
  renderStep($("st3"), t, T.st3 + .1, T.ckOut + .1);

  renderFinger(t, [[T.tap, L.btn]]);

  // ---------- le code s'envole, puis plonge dans le champ du paiement
  const flyOn = t > T.lift - .02 && t < T.land + .3;
  show($("fly"), flyOn);
  if (flyOn) {
    const b = L.btn, S1 = 2.4, p1 = eio(prog(t, T.lift, .7));
    let x = lerp(b.left, CX - L.flyW * S1 / 2, p1);
    let y = lerp(b.top, 560 - L.flyH * S1 / 2, p1) - Math.sin(p1 * Math.PI) * 70;
    let s = lerp(b.width / L.flyW, S1, p1), rot = lerp(0, -3, p1);
    if (t > T.lift + .7) { y += Math.sin((t - T.lift - .7) * 3.2) * 10; rot = -3 + Math.sin((t - T.lift - .7) * 2.4) * 1.2; }
    const p2 = eio(prog(t, T.dive, T.land - T.dive));
    if (p2 > 0) {
      const S2 = L.ftx.height / (L.flyH * .5);
      x = lerp(x, L.ftx.left - 18 * S2, p2); y = lerp(y, L.ftx.top + L.ftx.height / 2 - L.flyH * S2 / 2, p2);
      s = lerp(s, S2, p2); rot = lerp(rot, 0, p2);
    }
    $("fly").style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${s})`;
    $("fly").style.opacity = 1 - prog(t, T.land, .2);
  }

  // ---------- paiement
  const ckOn = t > T.ckIn && t < T.flash + .3;
  show($("ck"), ckOn);
  if (ckOn) {
    const pin = spring(prog(t, T.ckIn, 1.0)), py = eo5(prog(t, T.ckIn, .85)), pout = eio(prog(t, T.ckOut, .4));
    $("ck").style.transform = `perspective(2000px) translateY(${(1 - py) * 900 - pout * 120}px) rotateX(${(1 - pin) * 26}deg) scale(${(.92 + .08 * pin) * (1 - pout * .08)})`;
    $("ck").style.opacity = clamp(py * 1.6) * (1 - pout);
    blur($("ck"), pout * 10);
    const landed = t >= T.land;
    $("fph").style.display = landed || t > T.dive + .3 ? "none" : "";
    $("ftx").textContent = landed ? D.code : "";
    $("field").style.borderColor = landed ? "var(--green)" : (t > T.dive ? "var(--vio)" : "var(--line)");
    $("field").style.boxShadow = t > T.dive ? `0 0 0 5px ${landed ? "rgba(46,204,113,.18)" : "rgba(139,0,255,.22)"}` : "none";
    $("field").style.transform = landed ? `scale(${1 + .04 * Math.sin(prog(t, T.land, .3) * Math.PI)})` : "none";
    const ok = eo(prog(t, T.apply, .25));
    $("applyok").style.opacity = ok; $("applyok").style.transform = `scale(${.6 + .4 * back(ok)})`;
    const r = expo(prog(t, T.res, .45));
    $("res").style.opacity = r; $("res").style.transform = `translateY(${(1 - r) * 20}px)`;
  }
  [["msg1", T.msg], ["msg2", T.msg + .15]].forEach(([id, at]) => {
    const p = expo(prog(t, at, .55)), q = eio(prog(t, T.ckOut, .4));
    $(id).style.opacity = t > T.flash + .3 ? 0 : p * (1 - q);
    $(id).style.transform = `translateY(${(1 - p) * 40 - q * 60}px)`;
    blur($(id), (1 - p) * 10 + q * 10);
  });

  renderFlash(t, T.flash);
  renderOutro(t, T.outro);
}

boot();
</script>
